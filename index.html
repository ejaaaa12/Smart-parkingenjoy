<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Smart Parking 3D</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#020617;font-family:'Inter',sans-serif}
  #scene{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
  #scene:active{cursor:grabbing}
  .glass{background:rgba(15,23,42,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1)}
  .ui{position:fixed;z-index:10;pointer-events:none}
  .ui>*{pointer-events:auto}
</style>
</head>
<body class="text-slate-100">
<canvas id="scene"></canvas>

<!-- Header -->
<div class="ui top-3 left-3 right-3 flex items-start justify-between">
  <div class="glass rounded-2xl px-4 py-3 flex items-center gap-3">
    <div class="text-2xl">🚗</div>
    <div>
      <h1 class="font-bold leading-tight">Smart Parking 3D</h1>
      <p class="text-[11px] text-slate-400">IoT HiveMQ Realtime System</p>
    </div>
  </div>
  <div id="badge" class="glass rounded-full px-3 py-1.5 text-xs font-semibold flex items-center gap-2 text-rose-400">
    <span id="dot" class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span><span id="stext">Disconnected</span>
  </div>
</div>

<!-- Bottom panel -->
<div class="ui bottom-3 left-3 right-3 flex justify-center">
  <div class="glass rounded-3xl p-4 sm:p-5 w-full max-w-md space-y-3 shadow-2xl">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Sisa Slot</p>
        <div class="flex items-baseline gap-2">
          <span id="slot" class="text-5xl font-extrabold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">-</span>
          <span class="text-slate-500">/ 5</span>
        </div>
      </div>
      <div id="full" class="hidden px-3 py-1 rounded-full text-xs font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30 animate-pulse">PARKIR PENUH</div>
    </div>

    <div>
      <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
        <div id="bar" class="bg-blue-500 h-full rounded-full transition-all duration-500" style="width:0%"></div>
      </div>
      <p id="cap" class="text-[11px] text-slate-400 mt-1 text-right">Kapasitas: 0% Terisi</p>
    </div>

    <div class="grid grid-cols-3 gap-2 text-center text-[11px]">
      <div class="bg-slate-900/60 rounded-xl py-2 border border-slate-800"><p class="text-slate-500">Jarak</p><p id="dist" class="font-semibold text-sm">-</p></div>
      <div class="bg-slate-900/60 rounded-xl py-2 border border-slate-800"><p class="text-slate-500">Buzzer</p><p id="buz" class="font-semibold text-sm">-</p></div>
      <div class="bg-slate-900/60 rounded-xl py-2 border border-slate-800"><p class="text-slate-500">Zona</p><p id="zone" class="font-semibold text-sm truncate px-1">-</p></div>
    </div>

    <div id="evbox" class="rounded-xl p-3 border bg-blue-500/10 border-blue-500/30 flex items-center gap-3">
      <div>
        <p id="ev" class="text-sm font-semibold">Menunggu sinyal...</p>
        <p id="time" class="text-[11px] text-slate-500">Topic: parking/status</p>
      </div>
    </div>

    <button id="rst" onclick="resetSlots()" disabled
      class="w-full py-2.5 rounded-xl text-sm font-semibold bg-slate-800 text-slate-200 border border-slate-700 hover:bg-slate-700 active:scale-[.98] transition disabled:opacity-40 disabled:cursor-not-allowed">
      🔄 Reset Slot Parkir
    </button>
    <p class="text-center text-[10px] text-slate-500">Geser layar untuk memutar tampilan 3D</p>
  </div>
</div>

<script>
// ================= 3D SCENE =================
const MAX = 5, SPACING = 2.5, PARK_Z = -2, OUT_Z = 16;
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020617);
scene.fog = new THREE.Fog(0x020617, 22, 48);
const camera = new THREE.PerspectiveCamera(45, 1, .1, 100);

scene.add(new THREE.HemisphereLight(0x8ab4ff, 0x0b1220, .8));
const sun = new THREE.DirectionalLight(0xffffff, .9);
sun.position.set(6, 12, 8); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, {left:-14, right:14, top:14, bottom:-14});
scene.add(sun);

// Lantai
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({color:0x0f172a, roughness:.9}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const asphalt = new THREE.Mesh(new THREE.BoxGeometry(17, .1, 15), new THREE.MeshStandardMaterial({color:0x1e293b, roughness:.8}));
asphalt.position.set(0, .05, 3.5); asphalt.receiveShadow = true; scene.add(asphalt);

function label(t){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.font = 'bold 64px Inter,sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(t, 64, 64);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c), transparent:true, opacity:.75}));
  m.rotation.x = -Math.PI/2; return m;
}

function makeCar(color){
  const g = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({color, metalness:.5, roughness:.35});
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, .5, 2.3), paint); body.position.y = .5;
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1, .42, 1.2), new THREE.MeshStandardMaterial({color:0x0b1220, metalness:.8, roughness:.2}));
  cabin.position.set(0, .94, .1);
  g.add(body, cabin);
  const wm = new THREE.MeshStandardMaterial({color:0x111111});
  [[-.62,-.75],[.62,-.75],[-.62,.75],[.62,.75]].forEach(([x, z]) => {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(.27, .27, .22, 14), wm);
    w.rotation.z = Math.PI/2; w.position.set(x, .27, z); g.add(w);
  });
  const hm = new THREE.MeshBasicMaterial({color:0xfff2b0});
  [-.4, .4].forEach(x => { const h = new THREE.Mesh(new THREE.BoxGeometry(.25, .12, .05), hm); h.position.set(x, .55, -1.16); g.add(h); });
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}

const pads = [], cars = [];
const palette = [0x3b82f6, 0xf59e0b, 0x10b981, 0xa855f7, 0xec4899];
for (let i = 0; i < MAX; i++){
  const x = (i - (MAX-1)/2) * SPACING;
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 3.7), new THREE.MeshBasicMaterial({color:0x22c55e, transparent:true, opacity:.4}));
  pad.rotation.x = -Math.PI/2; pad.position.set(x, .11, PARK_Z); scene.add(pad); pads.push(pad);
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(2.1, 3.7)), new THREE.LineBasicMaterial({color:0xffffff}));
  edge.rotation.x = -Math.PI/2; edge.position.set(x, .12, PARK_Z); scene.add(edge);
  const lb = label('P' + (i+1)); lb.position.set(x, .13, PARK_Z + 1.4); scene.add(lb);
  const car = makeCar(palette[i % palette.length]);
  car.position.set(x, .1, OUT_Z); car.userData.target = OUT_Z; car.visible = false; scene.add(car); cars.push(car);
}

// Palang
const gatePivot = new THREE.Group(); gatePivot.position.set(-7, .9, 6.5); scene.add(gatePivot);
const post = new THREE.Mesh(new THREE.BoxGeometry(.5, 1.6, .5), new THREE.MeshStandardMaterial({color:0x334155}));
post.position.set(-7, .8, 6.5); post.castShadow = true; scene.add(post);
const arm = new THREE.Mesh(new THREE.BoxGeometry(4.5, .15, .15), new THREE.MeshStandardMaterial({color:0xfacc15, emissive:0x553d00}));
arm.position.x = 2.3; arm.castShadow = true; gatePivot.add(arm);
const lamp = new THREE.Mesh(new THREE.SphereGeometry(.18, 12, 12), new THREE.MeshBasicMaterial({color:0xef4444}));
lamp.position.set(-7, 1.75, 6.5); scene.add(lamp);

// Sensor ultrasonik
const sensor = new THREE.Mesh(new THREE.BoxGeometry(.9, .45, .35), new THREE.MeshStandardMaterial({color:0x2563eb, emissive:0x0a2a6b}));
sensor.position.set(0, 1.2, 6.5); scene.add(sensor);
[-.2, .2].forEach(x => { const e = new THREE.Mesh(new THREE.CylinderGeometry(.13, .13, .12, 16), new THREE.MeshStandardMaterial({color:0xcbd5e1})); e.rotation.x = Math.PI/2; e.position.set(x, 1.2, 6.3); scene.add(e); });
const stand = new THREE.Mesh(new THREE.CylinderGeometry(.06, .06, 1.1, 8), new THREE.MeshStandardMaterial({color:0x475569}));
stand.position.set(0, .6, 6.5); scene.add(stand);

// Kamera orbit (drag / sentuh)
let theta = 0, phi = .6, drag = false, lx = 0, ly = 0, idle = 0;
const tgt = new THREE.Vector3(0, 0, 2);
canvas.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', () => drag = false);
addEventListener('pointermove', e => {
  if (!drag) return;
  theta = Math.max(-1.1, Math.min(1.1, theta - (e.clientX - lx) * .005));
  phi = Math.max(.15, Math.min(1.25, phi + (e.clientY - ly) * .005));
  lx = e.clientX; ly = e.clientY; idle = 0;
});
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// State dari MQTT
let gateOpenUntil = 0, alarmUntil = 0, firstData = true, occupied = 0;
function applySlots(slot, animate){
  occupied = MAX - slot;
  cars.forEach((c, i) => {
    const want = i < occupied;
    c.userData.target = want ? PARK_Z : OUT_Z;
    if (want) c.visible = true;
    if (!animate) { c.position.z = c.userData.target; c.visible = want; }
  });
}

const clock = new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime(), now = Date.now();
  idle += 1;
  const sway = (!drag && idle > 180) ? Math.sin(t * .3) * .25 : 0;
  const a = theta + sway, r = innerWidth < innerHeight ? 23 : 17;
  camera.position.set(tgt.x + r * Math.sin(a) * Math.cos(phi), tgt.y + r * Math.sin(phi), tgt.z + r * Math.cos(a) * Math.cos(phi));
  camera.lookAt(tgt);

  const alarm = now < alarmUntil, blink = Math.sin(t * 14) > 0;
  pads.forEach((p, i) => {
    const occ = i < occupied;
    p.material.color.set(alarm ? (blink ? 0xef4444 : 0x7f1d1d) : (occ ? 0xef4444 : 0x22c55e));
    p.material.opacity = occ ? .35 : .3 + Math.sin(t * 2 + i) * .08;
  });
  cars.forEach(c => {
    c.position.z += (c.userData.target - c.position.z) * .06;
    if (c.userData.target === OUT_Z && c.position.z > OUT_Z - .3) c.visible = false;
  });
  const open = now < gateOpenUntil;
  gatePivot.rotation.z += ((open ? 1.2 : 0) - gatePivot.rotation.z) * .1;
  lamp.material.color.set(open ? 0x22c55e : 0xef4444);
  renderer.render(scene, camera);
})();

// ================= MQTT =================
const host = "2f77e302643340f8b63d38c051743935.s1.eu.hivemq.cloud";
const port = 8884, topic = "parking/status", resetTopic = "parking/reset";
const username = "mobcom", password = "mobcom123";
const client = new Paho.MQTT.Client(host, port, "WebDash-" + Math.random().toString(16).substr(2, 8));
const $ = id => document.getElementById(id);

function setConnected(ok){
  $('badge').className = "glass rounded-full px-3 py-1.5 text-xs font-semibold flex items-center gap-2 " + (ok ? "text-emerald-400" : "text-rose-400");
  $('dot').className = "w-2 h-2 rounded-full " + (ok ? "bg-emerald-400 animate-ping" : "bg-rose-500 animate-pulse");
  $('stext').innerText = ok ? "Live" : "Terputus";
  $('rst').disabled = !ok;
}
function resetSlots(){
  if (!client.isConnected()) return;
  if (!confirm("Reset slot parkir kembali ke " + MAX + "?")) return;
  const m = new Paho.MQTT.Message("RESET"); m.destinationName = resetTopic; client.send(m);
}
client.onConnectionLost = () => setConnected(false);
client.onMessageArrived = msg => {
  try {
    const d = JSON.parse(msg.payloadString);
    const slot = d.sisa_slot, full = slot === 0;

    // UI
    $('slot').innerText = slot;
    const pct = (MAX - slot) / MAX * 100;
    $('bar').style.width = pct + "%";
    $('bar').className = (full ? "bg-rose-500" : "bg-blue-500") + " h-full rounded-full transition-all duration-500";
    $('cap').innerText = `Kapasitas: ${pct}% Terisi`;
    $('full').classList.toggle('hidden', !full);
    $('dist').innerText = d.distance + " cm";
    $('buz').innerText = d.buzzer ? "🔊 ON" : "OFF";
    $('zone').innerText = d.status;

    const map = {
      MOBIL_MASUK:  ["🚗 Mobil Masuk (Slot Terisi)", "emerald"],
      PARKIR_PENUH: ["⛔ Parkir Penuh (Mobil Ditolak)", "rose"],
      RESET:        ["🔄 Slot di-reset", "blue"],
      STANDBY:      ["🅿️ Siaga (Menunggu Mobil)", "amber"]
    };
    const [txt, col] = map[d.event] || [d.status, "blue"];
    $('ev').innerText = txt;
    $('evbox').className = `rounded-xl p-3 border bg-${col}-500/10 border-${col}-500/30 flex items-center gap-3`;
    $('time').innerText = "Update: " + new Date().toLocaleTimeString();

    // 3D
    const prev = occupied;
    applySlots(slot, !firstData);
    if (!firstData) {
      if (d.event === "MOBIL_MASUK" && MAX - slot > prev) gateOpenUntil = Date.now() + 3500;
      if (d.event === "PARKIR_PENUH" && d.status && d.status.includes("!")) alarmUntil = Date.now() + 1800;
    }
    firstData = false;
  } catch (e) { console.error("Parse Error:", e); }
};
client.connect({
  timeout: 10, useSSL: true, userName: username, password: password,
  onSuccess: () => { setConnected(true); client.subscribe(topic); },
  onFailure: e => console.log("Connect Failed:", e)
});
</script>
</body>
</html>
